<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yalla Captain onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pg:#DDD8CC;--pt:#1F2933;--ink:#1F2933;--iv:#F5F1E8;--sand:#E8E1D5;--o:#E8754F;--t:#3D8078;--sub:#6B7078;--bad:#B8432A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#111417;--pt:#E5E7EB}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--pg);font-family:'Instrument Sans',system-ui,sans-serif;color:var(--pt);padding:28px 16px}
h1{font:800 22px 'Bricolage Grotesque';text-align:center;letter-spacing:-.03em}
.sub{text-align:center;color:var(--sub);font-size:13px;margin:6px 0 28px}
.grid{display:flex;flex-wrap:wrap;gap:36px 28px;justify-content:center}
figure{display:flex;flex-direction:column;align-items:center;gap:10px}
figcaption{font-size:12.5px;font-weight:500;color:var(--sub)}
.ph{width:300px;height:620px;border-radius:42px;background:var(--iv);border:7px solid #0f1215;position:relative;overflow:hidden;box-shadow:0 20px 44px rgba(0,0,0,.2);display:flex;flex-direction:column;color:var(--ink);font-size:14px}
.sb{height:28px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;padding:10px 24px 0;flex:none}
.pg{flex:1;display:flex;flex-direction:column;padding:6px 20px 0;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:12px}
.top svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t);margin-right:6px}
.road{display:flex;align-items:center}
.nd{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sand);color:var(--sub)}
.nd.d{background:var(--t);color:#fff}.nd.c{background:var(--iv);border:2.5px solid var(--o)}.nd.c::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--o)}
.ln{flex:1;height:0;border-top:2px dashed #CFC7B6;margin:0 3px}.ln.d{border-top:2px solid var(--t)}
.stp{font-size:12.5px;color:var(--sub);margin:12px 0 2px}
.h1{font:800 26px/1.15 'Bricolage Grotesque';letter-spacing:-.03em}
.why{font-size:13.5px;color:var(--sub);margin-top:5px;line-height:1.5}
.f{border-bottom:1.5px solid #D5CDBB;padding:9px 0 5px;margin-top:6px}.f.a{border-color:var(--o)}
.f label{font-size:12.5px;color:var(--sub);display:block}.f .v{font-size:17px;font-weight:500;height:30px;display:flex;align-items:center;justify-content:space-between}.f .v.e{color:#A9A395;font-weight:400}.f .v.k{color:var(--ink)}
.ft{margin-top:auto;padding:10px 0 16px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border:0;border-radius:14px;font:600 16px 'Instrument Sans';background:var(--o);color:#fff}
.btn.g{background:var(--sand);color:var(--ink)}.btn.sm{width:auto;height:36px;padding:0 16px;font-size:13.5px;border-radius:10px}.btn.dis{background:var(--sand);color:#9A9588}
.lk{color:var(--o);font-weight:600;font-size:13.5px;white-space:nowrap}
.rw{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #E1D9C9}.rw:last-child{border:0}.rw .x{flex:1;font-weight:500;font-size:15px}.rw small{display:block;color:var(--sub);font-weight:400;font-size:12.5px;line-height:1.45;margin-top:1px}
.st{font-size:13px;font-weight:600;color:var(--t);white-space:nowrap}.st.m{color:var(--sub)}
.sw{display:flex;gap:10px;margin-top:6px}.sw i{width:28px;height:28px;border-radius:50%;border:1.5px solid #CFC7B6}.sw i.s{outline:2.5px solid var(--t);outline-offset:2px}
.slot{width:84px;height:62px;border-radius:10px;border:1.5px dashed #BDB5A3;display:grid;place-items:center;flex:none;position:relative}.slot svg{width:54px;fill:none;stroke:#A39C8B;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slot.u{border:0;background:#CBD8D5}.slot.u svg{stroke:#fff}.slot.u::after{content:"✓";position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--t);color:#fff;font-size:11px;display:grid;place-items:center}
.slot.x{border:1.5px solid var(--bad);background:#F3DDD5}
.opt{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #E1D9C9}.opt .e{font-size:28px;width:40px;text-align:center}.opt .x{flex:1;font-weight:600;font-size:16px}.opt small{display:block;color:var(--sub);font-weight:400;font-size:12.5px;line-height:1.45}
.opt .r{width:22px;height:22px;border-radius:50%;border:2px solid #C9C1AF}.opt.s .r{border:7px solid var(--t)}.opt.s{background:rgba(61,128,120,.08);margin:0 -20px;padding:13px 20px}
.plate{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;font:800 20px 'Bricolage Grotesque';letter-spacing:.1em;width:fit-content;margin-top:8px;background:#fff}.plate span{padding:3px 12px}.plate span+span{border-left:2px solid var(--ink)}
.cam{background:#101417;color:#fff}.cam .sb{color:#fff}
.frm{width:244px;height:156px;margin:18px auto 14px;position:relative;border-radius:12px;background:rgba(255,255,255,.07)}.frm b{position:absolute;width:26px;height:26px;border:0 solid var(--o)}
.frm b:nth-child(1){top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:12px 0 0 0}.frm b:nth-child(2){top:-2px;right:-2px;border-width:3px 3px 0 0;border-radius:0 12px 0 0}.frm b:nth-child(3){bottom:-2px;left:-2px;border-width:0 0 3px 3px;border-radius:0 0 0 12px}.frm b:nth-child(4){bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 12px 0}
.shut{width:66px;height:66px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}.shut i{width:50px;height:50px;border-radius:50%;background:#fff}
.chk{width:84px;height:84px;border-radius:50%;background:var(--t);display:grid;place-items:center;margin:34px 0 20px}.chk svg{width:44px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .7s .3s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.chk svg{stroke-dashoffset:0}}
</style>
</head>
<body>
<h1>Yalla Captain, your road to the first trip</h1>
<p class="sub">9 onboarding screens. Tap a vehicle type on screen 3.</p>
<div class="grid">

<figure><div class="ph"><div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="pg">
<div data-s="0" data-t="Let's get to know you" data-d="Riders see your name and photo. We use your phone number to reach you."></div>
<div style="display:flex;gap:16px;align-items:center;margin:12px 0 2px"><div style="width:64px;height:64px;border-radius:50%;border:1.5px dashed #BDB5A3;display:grid;place-items:center;color:var(--sub);font-size:11.5px;flex:none">Photo</div><div style="flex:1"><b style="font-size:14.5px">A clear photo of your face</b><div class="why" style="margin:0">No sunglasses, good lighting.</div></div><span class="lk">Take photo</span></div>
<div class="f"><label>Full name</label><div class="v k">Mohamed Ahmed El-Sayed</div></div>
<div class="f"><label>Mobile number</label><div class="v k"><span>010 2345 6789</span><span class="st">Verified</span></div></div>
<div class="f a"><label>Date of birth</label><div class="v e">DD / MM / YYYY</div></div>
<div class="f"><label>Governorate and city</label><div class="v e">Choose your city, e.g. Shebin El Kom</div></div>
<div class="ft"><button class="btn">Continue</button></div></div></div><figcaption>1 · Personal info (partly filled)</figcaption></figure>

<figure><div class="ph"><div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="pg">
<div data-s="1" data-t="Driving license" data-d="We need to confirm you're allowed to drive. These details come from your license, not your ID."></div>
<div class="f"><label>Nationality</label><div class="v k">Egyptian</div></div>
<div class="f a"><label>License number</label><div class="v">1234567</div></div>
<div class="f"><label>License expiry date</label><div class="v e">DD / MM / YYYY</div></div>
<div style="display:flex;gap:12px;margin-top:16px"><div style="flex:1"><div class="slot" style="width:100%;height:84px"><span style="font-size:13px;color:var(--sub);text-align:center;line-height:1.5">License front<br><b class="lk">Take photo</b></span></div></div><div style="flex:1"><div class="slot" style="width:100%;height:84px"><span style="font-size:13px;color:var(--sub);text-align:center;line-height:1.5">License back<br><b class="lk">Take photo</b></span></div></div></div>
<div class="ft"><button class="btn">Continue</button></div></div></div><figcaption>2 · License details</figcaption></figure>

<figure><div class="ph"><div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="pg">
<div data-s="2" data-t="What will you drive?" data-d="The next fields change based on your choice."></div>
<div style="margin-top:6px" id="vt">
<div class="opt s" data-h="We'll ask for make, model, year, color and plate number."><div class="e">🚗</div><div class="x">Car<small>Private or taxi</small></div><div class="r"></div></div>
<div class="opt" data-h="We'll ask for make, model, color and plate number."><div class="e">🏍️</div><div class="x">Motorcycle<small>Motorcycle license required</small></div><div class="r"></div></div>
<div class="opt" data-h="We'll ask for make, color and plate number."><div class="e">🛵</div><div class="x">Scooter<small>Electric or petrol</small></div><div class="r"></div></div>
<div class="opt" style="border:0" data-h="No vehicle details or plate needed. You'll go straight to photos."><div class="e">🚲</div><div class="x">Bicycle<small>No vehicle details needed</small></div><div class="r"></div></div></div>
<div class="why" id="vh" style="margin-top:6px;color:var(--t);font-weight:500">We'll ask for make, model, year, color and plate number.</div>
<div class="ft"><button class="btn">Continue</button></div></div></div><figcaption>3 · Vehicle type</figcaption></figure>

<figure><div class="ph"><div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="pg">
<div data-s="2" data-t="Your car details" data-d="Enter them exactly as written on your car registration."></div>
<div style="display:flex;gap:16px"><div class="f" style="flex:1"><label>Make</label><div class="v k">Toyota</div></div><div class="f" style="flex:1"><label>Model</label><div class="v k">Corolla</div></div></div>
<div style="display:flex;gap:16px"><div class="f a" style="flex:1"><label>Year</label><div class="v">20</div></div><div class="f" style="flex:1"><label>Color</label><div class="v e">Choose</div></div></div>
<div class="sw"><i style="background:#fff"></i><i style="background:#1F2933"></i><i style="background:#9AA0A6"></i><i style="background:#B8432A"></i><i style="background:#2F5A8A"></i></div>
<div class="f" style="margin-top:14px"><label>Plate number</label><div class="plate"><span>4582</span><span>ABD</span></div></div>
<div class="ft"><button class="btn">Continue</button></div></div></div><figcaption>4 · Vehicle details</figcaption></figure>

<figure><div class="ph"><div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="pg">
<div data-s="3" data-t="3 photos of your car" data-d="Shoot in good light with the whole car in the frame."></div>
<div style="margin-top:8px">
<div class="rw"><div class="slot u"><svg viewBox="0 0 80 50"><path d="M14 36V24l6-12h40l6 12v12M10 36h60M22 26h36M20 36v6M60 36v6"/></svg></div><div class="x">Front<small>Photo uploaded</small></div><span class="lk">Replace</span></div>
<div class="rw"><div class="slot x"><svg viewBox="0 0 80 50" style="stroke:var(--bad)"><path d="M14 36V24l6-12h40l6 12v12M10 36h60M20 36v6M60 36v6"/></svg></div><div class="x">Rear<small style="color:var(--bad)">The photo is blurry. Hold your phone steady and retake it.</small></div><span class="lk">Retake</span></div>
<div class="rw"><div class="slot"><svg viewBox="0 0 80 50"><path d="M8 36V28l10-6 10-10h24l12 10h8v14M6 36h68M22 36a6 6 0 1 0 .1 0M58 36a6 6 0 1 0 .1 0"/></svg></div><div class="x">Side<small>Show the full side, wheel to wheel</small></div><button class="btn sm g">Take photo</button></div></div>
<div class="why" style="margin-top:8px">1 photo saved. 2 to go.</div>
<div class="ft"><button class="btn dis">Continue</button><div style="text-align:center;margin-top:8px"><span class="lk">Choose from gallery</span></div></div></div></div><figcaption>5 · Vehicle photos (uploaded, blurry, empty)</figcaption></figure>

<figure><div class="ph cam"><div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="pg" style="align-items:center;text-align:center">
<div style="width:100%;display:flex;justify-content:space-between;font-size:13px;opacity:.8;margin-top:6px"><span>Close</span><span>Flash</span></div>
<div style="font:800 21px 'Bricolage Grotesque';margin-top:14px">National ID</div><div style="font-size:14px;opacity:.75;margin-top:4px">Photograph the whole front of your ID</div>
<div class="frm"><b></b><b></b><b></b><b></b></div>
<div style="font-size:13.5px;opacity:.85;line-height:1.9">Place the ID inside the frame<br>Use good light and avoid glare<br>Every number must be readable</div>
<div style="margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 10px 22px"><span style="font-size:13.5px">Gallery</span><div class="shut"><i></i></div><span style="font-size:13.5px;opacity:0">Gallery</span></div></div></div><figcaption>6 · Camera (National ID)</figcaption></figure>

<figure><div class="ph"><div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="pg">
<div data-s="4" data-t="Required documents" data-d="3 of 5 saved. Finish the rest, then review everything."></div>
<div style="margin-top:4px">
<div class="rw"><div class="x">National ID, front<small>Photo uploaded</small></div><span class="st">✓ Done</span></div>
<div class="rw"><div class="x">National ID, back<small>Photo uploaded</small></div><span class="st">✓ Done</span></div>
<div class="rw"><div class="x">Driving license, front<small>Photo uploaded</small></div><span class="st">✓ Done</span></div>
<div class="rw"><div class="x">Driving license, back<small style="color:var(--bad)">Part of the license is cut off. Retake it with all edges visible.</small></div><span class="lk">Retake</span></div>
<div class="rw"><div class="x">Car registration<small>Confirms the car is yours or you may drive it</small></div><button class="btn sm">Take photo</button></div></div>
<div class="ft"><button class="btn dis">Continue to review</button></div></div></div><figcaption>7 · Document checklist</figcaption></figure>

<figure><div class="ph"><div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="pg">
<div style="margin:2px 0 6px;font-size:12px;color:var(--t);font-weight:600">Every stop on the road is complete</div><div class="h1">Review before you send</div>
<div style="margin-top:8px">
<div class="rw"><div class="x">Personal<small>Mohamed Ahmed El-Sayed, Shebin El Kom</small></div><span class="lk">Edit</span></div>
<div class="rw"><div class="x">License<small>No. 1234567, expires 03/2029</small></div><span class="lk">Edit</span></div>
<div class="rw"><div class="x">Vehicle<small>Toyota Corolla 2020, white, 4582 ABD</small></div><span class="lk">Edit</span></div>
<div class="rw"><div class="x">Photos<small>3 photos of your car</small></div><span class="lk">Edit</span></div>
<div class="rw"><div class="x">Documents<small>5 documents uploaded</small></div><span class="lk">Edit</span></div></div>
<div class="why" style="margin-top:10px">Only the Yalla review team can see your details.</div>
<div class="ft"><button class="btn">Submit for review</button></div></div></div><figcaption>8 · Review and submit</figcaption></figure>

<figure><div class="ph"><div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="pg">
<div class="chk"><svg viewBox="0 0 44 44"><path d="M10 23l9 9 16-19"/></svg></div>
<div class="h1" style="font-size:30px">We've got your details</div>
<div class="why" style="font-size:15px">We'll review them and let you know as soon as you're ready to start accepting trips.</div>
<div style="margin-top:22px"><div class="rw"><div class="x">We review your documents and photos<small>Usually takes 1 to 3 days</small></div><span class="st m">In progress</span></div><div class="rw"><div class="x">We message you on your phone<small>If a photo needs retaking, we'll say exactly which one</small></div></div><div class="rw"><div class="x">You start accepting trips</div></div></div>
<div class="ft"><button class="btn g">Check application status</button></div></div></div><figcaption>9 · Under review</figcaption></figure>
</div>
<script>
const N=['Personal','License','Vehicle','Photos','Documents'];
document.querySelectorAll('[data-s]').forEach(e=>{const s=+e.dataset.s;let r='';
N.forEach((n,i)=>{r+=`<div class="nd ${i<s?'d':i==s?'c':''}">${i<s?'✓':''}</div>`+(i<4?`<div class="ln ${i<s?'d':''}"></div>`:'')});
e.innerHTML=`<div class="top"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span><i></i>Progress saved</span></div><div class="road">${r}</div><div class="stp">${N[s]}, step ${s+1} of 5</div><div class="h1">${e.dataset.t}</div><div class="why">${e.dataset.d}</div>`});
document.getElementById('vt').onclick=ev=>{const o=ev.target.closest('.opt');if(!o)return;document.querySelectorAll('#vt .opt').forEach(x=>x.classList.toggle('s',x===o));document.getElementById('vh').textContent=o.dataset.h};
</script>
</body>
</html>
